# The .deb, .rpm and Arch .pkg.tar.zst of Port Why, built with nfpm
# (https://nfpm.goreleaser.com) by package.sh, which runs it from the staged
# prefix tree (bin/, lib/, share/) and sets:
#
#   VERSION  the version the app was built as (1.2.0, 1.2.0-dev.abc1234)
#   ARCH     amd64 or arm64; nfpm names it per format (x86_64, aarch64)
#
# Everything goes under /usr. The desktop database and icon cache are
# refreshed by the distributions' own triggers and hooks, so there are no
# install scripts.
name: port-why
version: ${VERSION}
version_schema: semver
arch: ${ARCH}
platform: linux
section: net
priority: optional
maintainer: ThirtyTech <noreply@thirtytech.net>
vendor: ThirtyTech
homepage: https://github.com/jsheely/port-why
description: |-
  See which process, project and folder owns every open port.
  Port Why lists every open port on the machine and tells you who owns it:
  the process, the framework or runtime behind it, the project it belongs
  to and the folder it runs in, following ports into Docker containers.

contents:
  - src: lib/port-why
    dst: /usr/lib/port-why
    type: tree
  - src: /usr/lib/port-why/port_why
    dst: /usr/bin/port-why
    type: symlink
  - src: share/applications/net.thirtytech.port_why.desktop
    dst: /usr/share/applications/net.thirtytech.port_why.desktop
  - src: share/icons/hicolor
    dst: /usr/share/icons/hicolor
    type: tree
  - src: share/doc/port-why
    dst: /usr/share/doc/port-why
    type: tree

# What the bundle links, from objdump of a release build: GTK 3 and what
# it pulls in, plus libepoxy, fontconfig, libstdc++ and zlib directly, and
# glibc 2.34 at the newest. The release builds on Ubuntu 22.04: a build on
# 24.04 needs GLib 2.80 (g_once_init_enter_pointer) and won't start on
# Debian 12. Flutter draws with EGL and OpenGL ES, which it loads at start
# (libEGL.so.1, libGLESv2.so.2), so those don't show as links. The scanner
# reads /proc and asks Docker only when it's there, so it needs no tools.
overrides:
  deb:
    depends:
      - libc6 (>= 2.34)
      - libgtk-3-0t64 | libgtk-3-0
      - libepoxy0
      - libfontconfig1
      - libstdc++6
      - zlib1g
      - libegl1
      - libgles2
  # Sonames rather than package names, so one .rpm installs on Fedora,
  # openSUSE and RHEL 9 alike.
  rpm:
    depends:
      - libc.so.6(GLIBC_2.34)(64bit)
      - libgtk-3.so.0()(64bit)
      - libepoxy.so.0()(64bit)
      - libfontconfig.so.1()(64bit)
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libGLESv2.so.2()(64bit)
  archlinux:
    depends:
      - glibc
      - gtk3
      - libepoxy
      - fontconfig
      - gcc-libs
      - zlib
      - libglvnd

rpm:
  group: Applications/System
  summary: See which process, project and folder owns every open port
  compression: zstd
archlinux:
  packager: ThirtyTech <noreply@thirtytech.net>
