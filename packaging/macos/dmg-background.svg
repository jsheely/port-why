<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 660 420" width="660" height="420">
  <!-- The .dmg window's background, after the Windows installer's sidebar
       (../windows/sidebar.svg): the same night, lights, floor and wordmark.
       660x420 points, the window's size in dmg.py. Finder draws the icons on
       top, centred at (190, 205) and (470, 205), and always draws their
       names in black on a picture background, hence the light tags under
       them. render.ps1 renders it to dmg-background.png and its @2x. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0920" />
      <stop offset="1" stop-color="#04050d" />
    </linearGradient>
    <radialGradient id="cyanLight" cx="0.12" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#19e3ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#19e3ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkLight" cx="0.95" cy="0.95" r="0.65">
      <stop offset="0" stop-color="#ff2e7e" stop-opacity="0.2" />
      <stop offset="1" stop-color="#ff2e7e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetLight" cx="0.55" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a573ff" stop-opacity="0.1" />
      <stop offset="1" stop-color="#a573ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19e3ff" stop-opacity="0" />
      <stop offset="1" stop-color="#19e3ff" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111530" stop-opacity="0.8" />
      <stop offset="1" stop-color="#0a0e22" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="tether" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="392" y2="0">
      <stop offset="0" stop-color="#19e3ff" />
      <stop offset="1" stop-color="#ff2e7e" />
    </linearGradient>
    <radialGradient id="iconLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#19e3ff" stop-opacity="0.2" />
      <stop offset="1" stop-color="#19e3ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="372" width="660" height="48" /></clipPath>
  </defs>

  <rect width="660" height="420" fill="url(#night)" />
  <rect width="660" height="420" fill="url(#cyanLight)" />
  <rect width="660" height="420" fill="url(#violetLight)" />
  <rect width="660" height="420" fill="url(#pinkLight)" />

  <!-- The neon floor, below the card -->
  <g clip-path="url(#floorClip)" stroke="url(#floorFade)" stroke-width="1" fill="none">
    <line x1="330" y1="372" x2="-470" y2="420" />
    <line x1="330" y1="372" x2="-230" y2="420" />
    <line x1="330" y1="372" x2="10" y2="420" />
    <line x1="330" y1="372" x2="170" y2="420" />
    <line x1="330" y1="372" x2="330" y2="420" />
    <line x1="330" y1="372" x2="490" y2="420" />
    <line x1="330" y1="372" x2="650" y2="420" />
    <line x1="330" y1="372" x2="890" y2="420" />
    <line x1="330" y1="372" x2="1130" y2="420" />
    <line x1="0" y1="378" x2="660" y2="378" />
    <line x1="0" y1="386" x2="660" y2="386" />
    <line x1="0" y1="397" x2="660" y2="397" />
    <line x1="0" y1="412" x2="660" y2="412" />
  </g>

  <!-- The card -->
  <rect x="28" y="24" width="604" height="344" rx="18" fill="url(#card)" stroke="#232b4d" stroke-width="1.2" />
  <line x1="48" y1="86" x2="612" y2="86" stroke="#232b4d" />

  <!-- Header: the icon and the wordmark, and THIRTYTECH on the right -->
  <image x="48" y="40" width="32" height="32" xlink:href="../icons/128.png" href="../icons/128.png" />
  <text x="94" y="62" font-family="Bahnschrift, 'DIN Alternate', sans-serif" font-weight="700" font-size="17" letter-spacing="4" fill="#ffffff" filter="url(#glow)">PORT WHY</text>
  <text x="612" y="60" text-anchor="end" font-family="Bahnschrift, 'DIN Alternate', sans-serif" font-weight="700" font-size="8" letter-spacing="2.6" fill="#6d7aa8">THIRTYTECH</text>

  <!-- Behind the app's icon -->
  <circle cx="190" cy="205" r="96" fill="url(#iconLight)" />

  <!-- The arrow, drawn as a port's tether with a packet on it -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <line x1="268" y1="205" x2="388" y2="205" stroke="url(#tether)" stroke-width="3" />
    <path d="M 376 195 L 390 205 L 376 215" stroke="#ff2e7e" stroke-width="3" />
    <circle cx="292" cy="205" r="5" fill="#04050d" stroke="#19e3ff" stroke-width="2.4" />
    <circle cx="330" cy="205" r="3.2" fill="#a573ff" stroke="none" />
  </g>

  <!-- Tags for Finder's black icon names -->
  <rect x="134" y="277" width="112" height="22" rx="11" fill="#dfe8ff" />
  <rect x="414" y="277" width="112" height="22" rx="11" fill="#dfe8ff" />

  <text x="330" y="342" text-anchor="middle" font-family="Bahnschrift, 'DIN Alternate', sans-serif" font-size="13" fill="#909dc6">Drag Port Why to Applications to install it.</text>
</svg>
