name: Release

# Builds Port Why for every system and processor it runs on, each on a runner of
# that kind, and tests it there first. Pushing a version tag (v1.2.3) publishes
# the builds as the GitHub release of that version; running the workflow by hand
# only builds them, as artifacts of the run.
#
# Each system gets an installer as well as an archive, made by the scripts in
# packaging/: an Inno Setup installer on Windows, a .dmg on macOS, and a .deb,
# .rpm and Arch package on Linux, whose tarball install.sh installs.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Flutter release the app is built with (the one .metadata names).
  FLUTTER_VERSION: 3.47.2

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          # Ubuntu 22.04, not 24.04: a build there needs GLib 2.80 and won't
          # start on Debian 12 or RHEL 9.
          - { os: linux, arch: x64, runner: ubuntu-22.04 }
          - { os: linux, arch: arm64, runner: ubuntu-22.04-arm }
          # One app for both Apple silicon and Intel Macs: Flutter builds macOS
          # releases as universal binaries.
          - { os: macos, arch: universal, runner: macos-26 }
    steps:
      - uses: actions/checkout@v7

      # Flutter only publishes x64 SDK archives for Windows and Linux, so clone
      # the release instead: its first run fetches the Dart SDK and engine built
      # for this runner's processor, and Flutter targets that processor.
      - name: Install Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test

      # A tag names the version (v1.2.3 builds 1.2.3); a build by hand is named
      # after its commit and keeps the version in pubspec.yaml, which its
      # installers carry as a pre-release of it (1.2.3-dev.abc1234).
      - name: Name the build
        id: name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "flags=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_SHA::7}"
            pubspec=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
            echo "version=$pubspec-dev.$version" >> "$GITHUB_OUTPUT"
          fi
          echo "package=port-why-$version-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - run: flutter build ${{ matrix.os }} --release ${{ steps.name.outputs.flags }}

      # Each package step first checks the build is for the processor it is
      # labelled with, since Flutter quietly falls back to x64 when it cannot
      # build natively.

      - name: Package for Windows
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          $bundle = "build/windows/${{ matrix.arch }}/runner/Release"
          $exe = [IO.File]::ReadAllBytes("$bundle/port_why.exe")
          $machine = [BitConverter]::ToUInt16($exe, [BitConverter]::ToInt32($exe, 0x3C) + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('port_why.exe is built for machine 0x{0:X4}, not ${{ matrix.arch }}' -f $machine) }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll') {
            if (-not (Test-Path "$bundle/$dll")) { throw "$dll is missing; the app would not start without the Visual C++ redistributable" }
          }
          # The zip and the installer (packaging/windows/port-why.iss).
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "couldn't install Inno Setup" }
          New-Item -ItemType Directory dist | Out-Null
          Push-Location dist
          ../packaging/windows/package.ps1 "../$bundle" $env:VERSION $env:PACKAGE
          Pop-Location
          if (-not (Test-Path "dist/$env:PACKAGE-setup.exe")) { throw 'no installer was built' }

      - name: Package for Linux
        if: matrix.os == 'linux'
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          bundle="build/linux/${{ matrix.arch }}/release/bundle"
          expected=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86-64)
          info=$(file -b "$bundle/port_why")
          echo "port_why: $info"
          [[ "$info" == *"$expected"* ]] || { echo "::error::port_why is not built for ${{ matrix.arch }}"; exit 1; }
          # nfpm builds the .deb, .rpm and .pkg.tar.zst (packaging/linux/nfpm.yaml).
          case "${{ matrix.arch }}" in
            x64) nfpm_arch=x86_64 nfpm_sum=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 ;;
            arm64) nfpm_arch=arm64 nfpm_sum=a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 ;;
          esac
          nfpm_tgz="$RUNNER_TEMP/nfpm.tar.gz"
          curl -fsSL -o "$nfpm_tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_$nfpm_arch.tar.gz"
          echo "$nfpm_sum  $nfpm_tgz" | sha256sum -c -
          tar -xzf "$nfpm_tgz" -C "$RUNNER_TEMP" nfpm
          mkdir dist
          cd dist
          NFPM="$RUNNER_TEMP/nfpm" ../packaging/linux/package.sh "../$bundle" "$VERSION" "$PACKAGE"

      - name: Package for macOS
        if: matrix.os == 'macos'
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
          # Optional: with these secrets the .dmg is signed with a Developer
          # ID and notarized (see packaging/macos/package.sh); without them
          # the app keeps Flutter's ad hoc signature.
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          app="build/macos/Build/Products/Release/Port Why.app"
          for binary in "$app/Contents/MacOS/Port Why" "$app/Contents/Frameworks/App.framework/App"; do
            archs=$(lipo -archs "$binary")
            echo "${binary#$app/}: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] \
              || { echo "::error::${binary#$app/} is not universal"; exit 1; }
          done
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$PACKAGE.zip"
          # The disk image (packaging/macos/dmg.py).
          cd dist
          ../packaging/macos/package.sh "../$app" "$PACKAGE"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.package }}
          path: dist/
          if-no-files-found: error
          # The package is compressed already.
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: src
      # install.sh checks the tarball it downloads against SHA256SUMS.txt.
      - name: Checksums
        working-directory: dist
        run: sha256sum port-why-* > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp src/install.sh dist/
          ls -l dist
          base="https://github.com/$GH_REPO/releases/download/$GITHUB_REF_NAME"
          {
            echo '## Install'
            echo
            echo 'Linux (x64, arm64), into `~/.local`:'
            echo
            echo '```sh'
            echo "curl -fsSL $base/install.sh | PORTWHY_VERSION=$GITHUB_REF_NAME sh"
            echo '```'
            echo
            for f in dist/port-why-*; do
              file="${f#dist/}"
              case "$file" in
                *-setup.exe) what='Windows installer' ;;
                *windows*.zip) what='Windows, to unpack anywhere' ;;
                *.dmg) what='macOS (Apple silicon and Intel): open it and drag Port Why to Applications' ;;
                *macos*.zip) what='macOS, the app alone' ;;
                *.deb) what="Debian and Ubuntu: \`sudo apt install ./$file\`" ;;
                *.rpm) what="Fedora, RHEL, openSUSE: \`sudo dnf install ./$file\` or \`sudo zypper install ./$file\`" ;;
                *.pkg.tar.zst) what="Arch Linux: \`sudo pacman -U $file\`" ;;
                *linux*.tar.gz) what='Linux, to unpack into `~/.local` or `/usr/local`' ;;
                *) what='' ;;
              esac
              echo "- [\`$file\`]($base/$file)${what:+: $what}"
            done
            echo
          } > notes.md
          # --generate-notes adds the changelog after notes.md.
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Port Why $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
