name: Release

# Builds Port Why for every system and processor it runs on, each on a runner of
# that kind, and tests it there first. Pushing a version tag (v1.2.3) publishes
# the builds as the GitHub release of that version; running the workflow by hand
# only builds them, as artifacts of the run.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Flutter release the app is built with (the one .metadata names).
  FLUTTER_VERSION: 3.47.2

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: x64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: linux, arch: x64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          # One app for both Apple silicon and Intel Macs: Flutter builds macOS
          # releases as universal binaries.
          - { os: macos, arch: universal, runner: macos-26 }
    steps:
      - uses: actions/checkout@v7

      # Flutter only publishes x64 SDK archives for Windows and Linux, so clone
      # the release instead: its first run fetches the Dart SDK and engine built
      # for this runner's processor, and Flutter targets that processor.
      - name: Install Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test

      # A tag names the version (v1.2.3 builds 1.2.3); a build by hand is named
      # after its commit and keeps the version in pubspec.yaml.
      - name: Name the build
        id: name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "flags=--build-name=$version --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_SHA::7}"
          fi
          echo "package=port-why-$version-${{ matrix.os }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - run: flutter build ${{ matrix.os }} --release ${{ steps.name.outputs.flags }}

      # Each package step first checks the build is for the processor it is
      # labelled with, since Flutter quietly falls back to x64 when it cannot
      # build natively.

      - name: Package for Windows
        if: matrix.os == 'windows'
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          $bundle = "build/windows/${{ matrix.arch }}/runner/Release"
          $exe = [IO.File]::ReadAllBytes("$bundle/port_why.exe")
          $machine = [BitConverter]::ToUInt16($exe, [BitConverter]::ToInt32($exe, 0x3C) + 4)
          $expected = if ('${{ matrix.arch }}' -eq 'arm64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ('port_why.exe is built for machine 0x{0:X4}, not ${{ matrix.arch }}' -f $machine) }
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll') {
            if (-not (Test-Path "$bundle/$dll")) { throw "$dll is missing; the app would not start without the Visual C++ redistributable" }
          }
          New-Item -ItemType Directory stage, dist | Out-Null
          Copy-Item -Recurse $bundle stage/port-why
          Compress-Archive -Path stage/port-why -DestinationPath "dist/$env:PACKAGE.zip"

      - name: Package for Linux
        if: matrix.os == 'linux'
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          bundle="build/linux/${{ matrix.arch }}/release/bundle"
          expected=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x86-64)
          info=$(file -b "$bundle/port_why")
          echo "port_why: $info"
          [[ "$info" == *"$expected"* ]] || { echo "::error::port_why is not built for ${{ matrix.arch }}"; exit 1; }
          mkdir stage dist
          cp -R "$bundle" stage/port-why
          tar -czf "dist/$PACKAGE.tar.gz" -C stage port-why

      - name: Package for macOS
        if: matrix.os == 'macos'
        env:
          PACKAGE: ${{ steps.name.outputs.package }}
        run: |
          app="build/macos/Build/Products/Release/Port Why.app"
          for binary in "$app/Contents/MacOS/Port Why" "$app/Contents/Frameworks/App.framework/App"; do
            archs=$(lipo -archs "$binary")
            echo "${binary#$app/}: $archs"
            [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]] \
              || { echo "::error::${binary#$app/} is not universal"; exit 1; }
          done
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$PACKAGE.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.package }}
          path: dist/
          if-no-files-found: error
          # The package is compressed already.
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Port Why $GITHUB_REF_NAME" --generate-notes
